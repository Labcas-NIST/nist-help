# Docker Composition for the NIST Help Portal
# ===========================================
#
# A set of composed services to run the NIST Help Portal. It supports a number of "incoming" environment
# variables. These all have defaults that should work fine on edrn-docker:
#
# - ALLOWED_HOSTS: The allowed hosts for the portal; defaults to .jpl.nasa.gov,.nist.gov,localhost.
# - CERT_CN: The Common Name for the self-signed TLS certificate; defaults to labcas.jpl.nasa.gov.
# - DATA_DIR: The directory to store the data in; defaults to /usr/local/labcas/nisthelp/docker-data.
# - FINAL_HOSTNAME: The final hostname for the portal; defaults to labcas.jpl.nasa.gov.
# - FORCE_SCRIPT_NAME: The force script name for the portal; defaults to /nist/help/.
# - HTTP_PORT: Non-encrypted local HTTP port; normally just for development and is not published; defaults to 8080.
# - HTTPS_PORT: Encrypted HTTPS port; defaults to 4239; this is normally published to the host.
# - IMAGE_VERSION: The version of the NIST Help Portal image to use; defaults to latest.
# - LDAP_URI: The URI for the LDAP server; defaults to ldaps://edrn-ds.jpl.nasa.gov.
# - STATIC_DIR: The directory to store the static files in; defaults to ${DATA_DIR:-/usr/local/labcas/nisthelp/docker-data}/static.
# - MEDIA_DIR: The directory to store the media files in; defaults to ${DATA_DIR:-/usr/local/labcas/nisthelp/docker-data}/media.
#
# These email-related environment variables have defaults in software rather than in this file:
#
# - EMAIL_HOST: The email host for the portal; defaults to smtp.jpl.nasa.gov.
# - EMAIL_PORT: The email port for the portal; defaults to 587.
# - EMAIL_HOST_USER: The email host user for the portal; defaults to not used.
# - EMAIL_HOST_PASSWORD: The email host password for the portal; defaults to not used.
# - EMAIL_USE_TLS: Whether to use TLS for the email; defaults to True.
# - EMAIL_USE_SSL: Whether to use SSL for the email; defaults to False.
#
# These require values:
#
# - POSTGRES_PASSWORD: The password for user "unh" in the PostgreSQL database; can be string.
# - SECRET_KEY: The secret key for the portal; can be string.
#
# These may also be set, but their defaults are perfectly reasonable and should not need to be overridden:
#
# - BASE_URL: The base URL for the portal; defaults to https://${FINAL_HOSTNAME:-labcas.jpl.nasa.gov}/nist/help/. This is used only for WAGTAILADMIN_BASE_URL.
# - CSRF_TRUSTED_ORIGINS: The trusted origins for the CSRF token; defaults to http://*.jpl.nasa.gov,https://*.jpl.nasa.gov,http://localhost,https://localhost.
# - MEDIA_URL: The URL to serve the media files from; defaults to /media/.
# - STATIC_URL: The URL to serve the static files from; defaults to /static/.


---

# Services
# --------

services:
    # Static Data
    # ~~~~~~~~~~~
    #
    # This "service" is used to gather the static data from the portal so it can be
    # served by the HTTPS proxy frontend.
    #
    # The volume may already hold a `collectstatic --link` tree: absolute symlinks
    # into the host source tree. Those dangle inside the container, and GNU cp will
    # not replace them ("not writing through dangling symlink"), so nginx 404s every
    # stylesheet and static image. Clear the mount, then copy the image's real files.
    static_initializer:
        image: edrndocker/nisthelp:${IMAGE_VERSION:-latest}
        entrypoint: /bin/sh
        command: ['-c', 'find /mnt/volume -mindepth 1 -delete && cp -aR /app/static/. /mnt/volume/']
        user: root
        volumes:
            -   static:/mnt/volume


    # HTTPS proxy frontend
    # ~~~~~~~~~~~~~~~~~~~~
    #
    # Gives an encrypted entrypoint to the whole kit 'n kaboodle on HTTPS_PORT or 4239
    tls:
        image: edrndocker/proxycrypt:latest
        profiles:
            -   tls
        environment:
            PROXY_URL: http://portal:8000/
            CERT_CN: ${CERT_CN:-labcas.jpl.nasa.gov}
            PROXY_PATH: /
            PROXY_PORT: ${HTTPS_PORT:-4239}
            PROXY_REDIRECT: default
        volumes:
            -   media:/app/media
            -   static:/app/static
        ports:
            -
                target: 443
                published: ${HTTPS_PORT:-4239}
                protocol: tcp
                mode: host
        depends_on:
            -   static_initializer
            -   portal
        networks:
            -   lattice
            -   default


    # NIST Help Wagtail-based Portal
    # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    #
    # Nominally on port 8000, published to ${HTTP_PORT} or 8080.
    # For a TLS endpoint, enable the profile `tls` and use HTTPS_PORT or 4239.
    portal:
        image: edrndocker/nisthelp:${IMAGE_VERSION:-latest}
        volumes:
            -   media:/app/media
            -   static:/app/static
        ports:
            -
                target: 8000
                published: ${HTTP_PORT:-8080}
                protocol: tcp
                mode: host
        security_opt:
            -   no-new-privileges:true
            -   label=type:container_t
            -   label=level:s0
        pids_limit: 50
        mem_limit: 1g
        cpu_shares: 1024
        tmpfs:
            -   /tmp
        networks:
            -   lattice
            -   default
        environment:
            SECRET_KEY:
            EMAIL_HOST:
            EMAIL_PORT:
            EMAIL_HOST_USER:
            EMAIL_HOST_PASSWORD:
            EMAIL_USE_TLS:
            EMAIL_USE_SSL:
            CSRF_TRUSTED_ORIGINS:
            DATABASE_URL: postgresql://unh:${POSTGRES_PASSWORD}@db:5432/nisthelp
            LDAP_URI: ${LDAP_URI:-ldaps://edrn-ds.jpl.nasa.gov}
            FORCE_SCRIPT_NAME: ${FORCE_SCRIPT_NAME:-/nist/help}
            ALLOWED_HOSTS: ${ALLOWED_HOSTS:-.jpl.nasa.gov,.nist.gov,localhost}
            STATIC_URL: ${STATIC_URL:-/static/}
            MEDIA_URL: ${MEDIA_URL:-/media/}
            BASE_URL: ${BASE_URL:-https://${FINAL_HOSTNAME:-labcas.jpl.nasa.gov}/}
            DJANGO_SETTINGS_MODULE: nisthelp.settings.production
        depends_on:
            -   static_initializer
            -   db
        restart: unless-stopped
        stop_grace_period: 23s
        labels:
            org.label-schema.name: NIST Help Portal
            org.label-schema.description: >
                Wagtail serving the CMS for the NIST Help portal.

    # NIST Help Database
    # ~~~~~~~~~~~~~
    #
    # Port 5432, non-published.
    db:
        image: postgres:17.9-alpine3.23
        # Note: using a user like "999:999" causes this service to fail on its first start.
        # Do _not_ use this next line:
        # user: "999:999"
        read_only: true
        tmpfs:
            -   /tmp
            -   /var/run/postgresql
        volumes:
            -   "database_volume:/var/lib/postgresql/data"
        security_opt:
            -   no-new-privileges:true
            -   label=type:container_t
            -   label=level:s0
        pids_limit: 50
        mem_limit: 128m
        cpu_shares: 768
        networks:
            -   lattice
        environment:
            POSTGRES_PASSWORD:
        restart: on-failure
        stop_grace_period: 13s
        labels:
            org.label-schema.name: EDRN Content DB
            org.label-schema.description: PostgreSQL database serving the EDRN portal.


# Volumes
# -------
#
# Thankfully, this is pretty simple.

volumes:
    # This volume can't be called "database"; it conflicts with something in Docker. But
    # "database_volume" is okay.
    database_volume:
        driver: local
        driver_opts:
            type: none
            device: ${DATA_DIR:-/usr/local/labcas/nisthelp/docker-data}/postgresql
            o: bind
        labels:
            org.label-schema.name: NIST Help Portal Database Data
            org.label-schema.description: PostgreSQL database data for the NIST Help portal.
    media:
        driver: local
        driver_opts:
            type: none
            device: ${MEDIA_DIR:-${DATA_DIR:-/usr/local/labcas/nisthelp/docker-data}/media}
            o: bind
        labels:
            org.label-schema.name: NIST Help Portal Media Data
            org.label-schema.description: Media blobs (images, PDFs, etc.) for the NIST Help portal.
    static:
        driver: local
        driver_opts:
            type: none
            device: ${STATIC_DIR:-${DATA_DIR:-/usr/local/labcas/nisthelp/docker-data}/static}
            o: bind
        labels:
            org.label-schema.name: NIST Help Portal Static Data
            org.label-schema.description: Static files (css, images, js) for the NIST Help portal.


# Networks
# --------
#
# Thankfully, this is also pretty simple.

networks:
    lattice:
        driver: bridge
        external: false
        labels:
            org.label-schema.name: NIST Help Portal Lattice Network
            org.label-schema.description: >
                Internal bridge network so the services that comprise the NIST Help Portal may communicate.

