# NIST Help Portl Imaging
# =======================
#
# This workflow builds and registers an image of the NIST help portal in the Docker Hub.

---

name: NIST Help Portal Imaging


# Triggers
# --------
#
# Run on any push to main or release branches of the NIST help portal code.

on:
    push:
        branches:
            -   main
            -   release/*
            -   issue/*
        paths:
            -   'src/**'
            -   'docker/Dockerfile'


# Jobs
# ----
#
# What to do.

jobs:
    imaging:
        name: 🏞 NIST Help Portal Imaging
        runs-on: ubuntu-latest
        steps:
            -
                name: 💳 Docker Hub Identification
                uses: docker/login-action@v3
                with:
                    username: ${{secrets.DOCKERHUB_USERNAME}}
                    password: ${{secrets.DOCKERHUB_TOKEN}}
            -
                name: 📚 Repository Checkout
                uses: actions/checkout@v6
            -
                name: 🎰 QEMU Multiple Machine Emulation
                uses: docker/setup-qemu-action@v3
            -
                name: 🚢 Docker Buildx
                uses: docker/setup-buildx-action@v3
            -
                name: 🧱 Image Construction and Publication
                uses: docker/build-push-action@v6
                with:
                    context: .
                    file: docker/Dockerfile
                    platforms: linux/amd64,linux/arm64
                    push: true
                    tags: |
                        ${{secrets.DOCKERHUB_USERNAME}}/nisthelp:latest

...

